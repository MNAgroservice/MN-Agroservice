<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MN AgroService - Registro de Mantenciones</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1a0f;color:#e8f5e9;font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column}
header{background:#162116;border-bottom:1px solid #2a3d2a;position:sticky;top:0;z-index:100}
.header-inner{max-width:960px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo-title{font-size:18px;font-weight:bold;color:#4ade80;letter-spacing:1px}
.logo-sub{font-size:11px;color:#86a887;letter-spacing:2px;text-transform:uppercase}
nav{display:flex;gap:8px}
.nav-btn{background:transparent;border:1px solid #2a3d2a;color:#86a887;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-family:Georgia,serif}
.nav-btn.active{background:#166534;border-color:#4ade80;color:#4ade80}
main{flex:1;max-width:960px;margin:0 auto;padding:30px 20px;width:100%}
.section{max-width:720px;margin:0 auto;width:100%}
h2{font-size:24px;font-weight:bold;margin-bottom:24px}
.hero{text-align:center;padding:40px 20px}
.hero-badge{display:inline-block;background:#166534;color:#4ade80;font-size:11px;letter-spacing:3px;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:20px}
.hero-title{font-size:clamp(28px,5vw,52px);font-weight:bold;line-height:1.2;margin-bottom:16px}
.hero-desc{font-size:16px;color:#86a887;max-width:500px;margin:0 auto 30px}
.hero-row{display:flex;gap:8px;max-width:520px;margin:0 auto;flex-wrap:wrap;justify-content:center}
.hero-input{flex:1;min-width:200px;background:#1c2b1c;border:1px solid #2a3d2a;border-radius:8px;padding:12px 16px;color:#e8f5e9;font-size:15px;outline:none;font-family:Georgia,serif}
.hero-btn{background:#4ade80;color:#0a120a;border:none;border-radius:8px;padding:12px 24px;font-weight:bold;font-size:15px;cursor:pointer;font-family:Georgia,serif}
.stats-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.stat{background:#1c2b1c;border:1px solid #2a3d2a;border-radius:12px;padding:20px 32px;text-align:center;flex:1 1 120px}
.stat-n{font-size:36px;font-weight:bold;color:#4ade80}
.stat-l{font-size:12px;color:#86a887;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.search-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
input,select,textarea{background:#1c2b1c;border:1px solid #2a3d2a;border-radius:8px;padding:10px 14px;color:#e8f5e9;font-size:14px;outline:none;width:100%;font-family:Georgia,serif}
.btn{background:#4ade80;color:#0a120a;border:none;border-radius:8px;padding:10px 22px;font-weight:bold;font-size:14px;cursor:pointer;white-space:nowrap;font-family:Georgia,serif}
.btn-saved{background:#22c55e;color:#fff;border:none;border-radius:8px;padding:10px 22px;font-weight:bold;font-size:14px;cursor:default;font-family:Georgia,serif}
.btn-pdf{background:#1d4ed8;color:#fff;border:none;border-radius:8px;padding:12px 22px;font-weight:bold;font-size:14px;cursor:pointer;font-family:Georgia,serif;width:100%;margin-top:8px}
.btn-del{background:#7f1d1d;color:#fca5a5;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;width:100%;margin-top:8px;font-family:Georgia,serif}
.btn-clear{background:#2a3d2a;color:#86a887;border:none;border-radius:6px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:Georgia,serif;margin-top:8px}
.error{color:#f87171;font-size:13px;margin:8px 0}
.success{color:#4ade80;font-size:13px;margin:8px 0}
.back-btn{background:transparent;border:none;color:#4ade80;cursor:pointer;font-size:14px;margin-bottom:16px;padding:0;font-family:Georgia,serif}
.result-header{display:flex;align-items:center;justify-content:space-between;background:#1c2b1c;border:1px solid #2a3d2a;border-radius:10px;padding:16px 20px;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.result-title{font-size:18px;font-weight:bold}
.result-meta{font-size:13px;color:#86a887;margin-top:4px}
.badge{background:#166534;color:#4ade80;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:bold}
.timeline{display:flex;flex-direction:column;gap:12px}
.tl-item{display:flex;gap:16px;cursor:pointer}
.tl-dot{width:12px;height:12px;border-radius:50%;background:#4ade80;margin-top:6px;flex-shrink:0;box-shadow:0 0 8px #4ade80}
.tl-card{flex:1;background:#1c2b1c;border:1px solid #2a3d2a;border-radius:10px;padding:14px 18px}
